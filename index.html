<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta
      name="description"
      content="Explore the Ruvva invitation collection. Discover Temple Dawn and Floral Elegant, and open a complete invitation preview."
    />
    <title>Ruvva — The Invitation Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="gallery/style.css" />
    <script src="gallery/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#collection" data-copy="skip"></a>
    <header class="header wrap">
      <a class="brand" href="./" aria-label="Ruvva home"
        ><svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path
            d="M20 6c9-10 19 2 9 10 13-1 13 15 0 14 4 12-11 17-15 4C3 42-4 28 7 22-5 16 3 3 14 10 13-4 29-4 28 10"
            transform="translate(3 3) scale(.85)"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="m15 14 12 12m-12 0 12-12"
            stroke="currentColor"
            stroke-width="2"
          /></svg
        ><span data-copy="brand"></span
      ></a>
      <a class="header-link" href="#collection" data-copy="browse"></a>
      <span class="header-note" data-copy="headerNote"></span>
    </header>
    <main>
      <section class="intro wrap" aria-labelledby="intro-title">
        <div>
          <p class="eyebrow">
            <span class="tiny-flower" aria-hidden="true">✳</span>
            <span data-copy="eyebrow"></span>
          </p>
          <h1 id="intro-title">
            <span data-copy="headline"></span><br /><span
              class="headline-second"
              data-copy="headlineSecond"
            ></span
            ><svg
              class="headline-flower"
              viewBox="0 0 80 80"
              fill="none"
              aria-hidden="true"
            >
              <g stroke="currentColor" stroke-width="1.3">
                <ellipse cx="40" cy="25" rx="9" ry="19" />
                <ellipse
                  cx="40"
                  cy="25"
                  rx="9"
                  ry="19"
                  transform="rotate(60 40 40)"
                />
                <ellipse
                  cx="40"
                  cy="25"
                  rx="9"
                  ry="19"
                  transform="rotate(120 40 40)"
                />
                <ellipse
                  cx="40"
                  cy="25"
                  rx="9"
                  ry="19"
                  transform="rotate(180 40 40)"
                />
                <ellipse
                  cx="40"
                  cy="25"
                  rx="9"
                  ry="19"
                  transform="rotate(240 40 40)"
                />
                <ellipse
                  cx="40"
                  cy="25"
                  rx="9"
                  ry="19"
                  transform="rotate(300 40 40)"
                />
                <circle cx="40" cy="40" r="5" fill="#f7f6f2" />
              </g>
            </svg>
          </h1>
        </div>
        <div class="intro-note">
          <span class="note-line" aria-hidden="true"></span>
          <p data-copy="intro"></p>
          <a class="text-link" href="#collection"
            ><span data-copy="explore"></span
            ><span aria-hidden="true">↘</span></a
          >
        </div>
      </section>
      <section
        class="collection wrap"
        id="collection"
        aria-labelledby="collection-title"
      >
        <div class="section-heading">
          <h2 id="collection-title" data-copy="collection"></h2>
          <span id="total" class="collection-count"></span>
        </div>
        <div class="toolbar">
          <div
            id="filters"
            class="filters"
            role="group"
            aria-label="Filter invitation styles"
          ></div>
          <label class="search"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m15.5 15.5 5 5" /></svg
            ><span class="sr-only" data-copy="searchLabel"></span
            ><input
              id="search"
              type="search"
              autocomplete="off"
              maxlength="100"
          /></label>
        </div>
        <p id="status" class="sr-only" role="status" aria-live="polite"></p>
        <div id="grid" class="grid" aria-busy="true"></div>
        <div id="empty" class="empty" hidden>
          <p data-copy="empty"></p>
          <button
            id="reset"
            class="text-link"
            type="button"
            data-copy="reset"
          ></button>
        </div>
        <p id="error" class="error" hidden data-copy="error"></p>
        <noscript
          ><p>
            This collection needs JavaScript. Open
            <a href="themes/temple-dawn/">Temple Dawn</a> or
            <a href="themes/floral-elegant/">Floral Elegant</a> directly.
          </p></noscript
        >
      </section>
      <section class="collection-note wrap" aria-labelledby="note-title">
        <svg
          viewBox="0 0 48 48"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          aria-hidden="true"
        >
          <path d="M24 4v40M4 24h40M10 10l28 28M10 38l28-28" />
          <circle cx="24" cy="24" r="13" />
        </svg>
        <div>
          <h2 id="note-title" data-copy="noteTitle"></h2>
          <p data-copy="note"></p>
        </div>
        <a href="#collection" class="back-top"
          ><span data-copy="back"></span><span aria-hidden="true">↑</span></a
        >
      </section>
    </main>
    <footer class="footer wrap">
      <span data-copy="footer"></span><span data-copy="footerNote"></span>
    </footer>
  </body>
</html>
